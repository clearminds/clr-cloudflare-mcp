[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-cloudflare-mcp"
version = "1.0.0"
description = "MCP server for Cloudflare DNS, cache purge, and Workers routes"
authors = [{name = "Clearminds", email = "noc@clearminds.se"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14.0,<3",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
clr-cloudflare-mcp = "clr_cloudflare_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clr_cloudflare_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
